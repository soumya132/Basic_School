services:
  - type: web
    name: Saraswati_Sisu_Vidya_Mandir
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: SITE_URL
        value: https://saraswati-sisu-vidya-mandir.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
